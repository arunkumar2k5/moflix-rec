<title>Moflix</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b0710;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* room */
#room{position:fixed;inset:0;overflow:hidden;z-index:1;background:#0b0710}
#scene{position:absolute}
#scene>svg{width:100%;height:100%;display:block}
.m{animation:mote 7s ease-in-out infinite;opacity:.7}
@keyframes mote{50%{transform:translate(8px,-18px);opacity:.2}}
.flick{animation:flick 4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.8}55%{opacity:.95}}

/* TV screen */
#tvScreen{position:absolute;left:40%;top:33.3333%;width:20%;height:20%;background:#0f0f0f;overflow:hidden;
  border-radius:2px;box-shadow:0 0 50px 8px rgba(160,190,255,.35);pointer-events:none}
#tvScreen::after{content:"";position:absolute;inset:0;opacity:var(--scan,1);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);animation:flick 5s infinite;pointer-events:none}
#tvLogo{position:absolute;inset:0;container-type:inline-size;display:flex;align-items:center;justify-content:center}
#tvLogo .fb{font:900 20cqw Impact,"Arial Narrow",sans-serif;color:#e10b17;letter-spacing:.04em;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 6px rgba(225,11,23,.7))}}

/* login widget — top-right corner */
#loginBox{position:fixed;top:20px;right:20px;z-index:10;background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:18px 20px;
  width:260px;backdrop-filter:blur(12px)}
#loginBox h2{font-size:14px;font-weight:700;color:#f3dcc0;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
#loginBox select,#loginBox input{width:100%;padding:9px 12px;background:#1a1a1a;border:1px solid #2e2e2e;
  border-radius:7px;color:#f3ede6;font-size:13px;margin-bottom:10px;appearance:none;-webkit-appearance:none}
#loginBox select option{background:#1a1a1a}
#loginBox input::placeholder{color:#666}
#loginBox button{width:100%;padding:10px;background:#e10b17;color:#fff;border:0;border-radius:7px;
  font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.04em}
#loginBox button:hover{background:#ff1a24}
#loginBox button:disabled{opacity:.5;cursor:default}
#loginErr{color:#ff7070;font-size:12px;margin-top:8px;min-height:1.2em}

</style>

<!-- login widget top-right -->
<div id="loginBox">
  <h2>Who's watching?</h2>
  <select id="username" aria-label="Select user"><option value="">Select user…</option></select>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
  <div id="loginErr" role="alert"></div>
</div>


<script>
const CSRF = document.querySelector('meta[name="csrf-token"]').content;

/* load users */
fetch('/api/users').then(r => r.json()).then(users => {
  const sel = document.getElementById('username');
  users.forEach(u => {
    const o = document.createElement('option');
    o.value = u.name; o.textContent = u.name; sel.appendChild(o);
  });
}).catch(() => {
  document.getElementById('loginErr').textContent = 'Could not load users';
});

/* login + zoom-in then navigate */
async function doLogin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  if (!username) { err.textContent = 'Please select a user'; return; }
  if (!password) { err.textContent = 'Enter your password'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ username, password })
    });
    if (r.ok) {
      document.getElementById('loginBox').style.opacity = '0';
      tweenTo(1, 1400);
      setTimeout(() => location.assign('/'), 1500);
    } else {
      const msg = { 401: 'Wrong username or password', 403: 'Page expired — reload', 429: 'Too many attempts' };
      err.textContent = msg[r.status] || 'Something went wrong';
      btn.disabled = false; btn.textContent = 'Log in';
    }
  } catch(e) {
    err.textContent = 'Network error'; btn.disabled = false; btn.textContent = 'Log in';
  }
}
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* zoom engine */
const scene = document.getElementById('scene');
const tvScreen = document.getElementById('tvScreen');
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const easeIO = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
let p=0, mode='idle', tw=null, raf=0, last=0, kEnd=5, dx=0, dy=0;

function layout() {
  const vw=innerWidth, vh=innerHeight;
  const cw=Math.max(vw, vh*16/9), ch=cw*9/16;
  Object.assign(scene.style, {width:cw+'px', height:ch+'px', left:(vw-cw)/2+'px', top:(vh-ch)/2+'px',
    transformOrigin:(0.5*cw)+'px '+(0.43333*ch)+'px'});
  kEnd = Math.max(vw/(0.2*cw), vh/(0.2*ch));
  dx = 0; dy = vh/2 - ((vh-ch)/2 + 0.43333*ch);
  render();
}

function render() {
  const f = 1 - Math.pow(1-p, 1.8);
  const k = Math.exp(Math.log(kEnd)*p);
  scene.style.transform = `translate(${dx*f}px,${dy*f}px) scale(${k})`;
  tvScreen.style.setProperty('--scan', 1 - clamp((p-.0)/(.4-.0)));
}

function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function tweenTo(to, ms) { tw = {from:p, to, t0:performance.now(), ms}; mode='tween'; kick(); }

function frame(t) {
  raf = 0;
  last = t;
  if (mode==='tween' && tw) {
    const u = clamp((t-tw.t0)/tw.ms);
    p = tw.from + (tw.to-tw.from)*easeIO(u);
    if (u >= 1) { p=tw.to; mode='idle'; tw=null; }
  }
  render();
  if (mode !== 'idle') kick();
}

addEventListener('resize', layout);
layout();
</script>
