[project]
name = "moflix-rec"
version = "0.1.0"
description = "Self-hosted chat-based movie recommender"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["factory/", "harness/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
